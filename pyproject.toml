[project]
name = "apple-reminders-mcp"
version = "0.3.0"
description = "MCP server for Apple Reminders on macOS via EventKit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.0.0",
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-EventKit>=10.0",
    "pyobjc-framework-CoreLocation>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]

[project.scripts]
apple-reminders-mcp = "apple_reminders_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_reminders_mcp"]

[dependency-groups]
dev = []
